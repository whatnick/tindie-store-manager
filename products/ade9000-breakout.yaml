sku: "ADE9000-BREAKOUT"
name: "ADE9000 Polyphase Energy Monitor Breakout"
description: |
  Assembled development breakout for the Analog Devices ADE9000 polyphase
  energy-metering and power-quality IC. The board exposes three voltage
  channels, four current channels (phases A/B/C plus neutral), and the ADE9000
  SPI, interrupt, calibration-frequency, data-ready, clock, and reset signals.

  The analog signal conditioning follows the ADE9000 datasheet test circuit.
  It includes RC anti-aliasing filters on all seven differential input pairs,
  2.4 ohm burden resistors for the four CT inputs, voltage-divider components
  for the three voltage channels, a 24.576 MHz crystal, reset network, voltage
  reference decoupling, and a CF2 activity LED. Current transformers connect
  through four 3.5 mm stereo sockets and voltage inputs use screw terminals.
  A breadboard-compatible 0.1 inch digital header footprint provides access
  to the 3.3 V SPI and control interface.

  The ADE9000 supports energy measurement, RMS values, waveform sampling,
  power-quality monitoring, zero-crossing detection, and calibration outputs.
  SPI operates in mode 0 at up to 20 MHz. Complete KiCad design files, a
  purchasing BOM, interactive BOM, 3D model, and assembly STEP export are
  available in the open-hardware GitHub repository.

  What's included:
  - 1x fully assembled ADE9000 breakout board
  - ADE9000, crystal, filtering, burden/divider networks, connectors, and LED
  - Pin headers are supplied unsoldered where applicable

  This is a development board, not a certified energy meter. It has no
  galvanic isolation and must not be connected directly to hazardous voltages
  without correctly rated external isolation, protection, fusing, enclosure,
  and appropriate electrical-safety practices. Current transformers and host
  controller are not included.
