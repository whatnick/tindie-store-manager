sku: "DS1683-QG-BRK-V1"
name: "DS1683 I2C Pulse Counter Breakout"
description: |
  Compact breakout for the Maxim/Analog Devices DS1683 elapsed-time recorder
  and event counter. The board exposes I2C and event inputs through compact
  connector footprints, with onboard 3.3 V regulation and level shifting.

  The DS1683 provides non-volatile elapsed-time and event counting for runtime
  logging, equipment maintenance, and usage monitoring. KiCad design files,
  an interactive BOM, and a companion Arduino demonstration sketch are
  available from the project repositories.

  Cables, headers, event sensors, and a host controller are not included.
