sku: "STPM33-BREAKOUT"
name: "STPM33 Dual-Current Energy Metering Breakout"
description: |
  Fully assembled open-hardware development board for the STMicroelectronics
  STPM33 energy-metering ASIC. It measures one isolated low-voltage AC channel
  and two current-transformer channels sharing the same voltage reference,
  making it suitable for phase/neutral comparison, tamper-detection research,
  dual-current experiments, and energy-monitoring firmware development.

  The voltage front end is designed for an isolated 9 VAC transformer
  secondary. Each current input is designed around a 100 A:50 mA
  current-output CT and uses a 2.4 ohm differential burden, producing
  approximately 120 mV RMS at rated current. Symmetric filtering and separate
  analog and digital ground pours support repeatable measurement experiments.

  A 1x14, 2.54 mm development header exposes the analog inputs, 3.3 V supply,
  ground, SPI/UART communications, synchronization, and enable signals. Five
  underside test pads expose both interrupt outputs, two LED/pulse outputs,
  and CLKOUT/zero-crossing. A solder-jumper selects SPI by default or UART
  after reconfiguration and reset. STPM33 does not use I2C.

  Complete KiCad 10 design files, manufacturing outputs, sourcing data,
  reconstruction scripts, and validation instructions are published in the
  open-hardware repository.

  What's included:
  - 1x fully assembled STPM33 Breakout
  - STPM33 metering IC, crystal, analog front ends, reset switch, selector,
    test pads, and fitted 1x14 header

  Current transformers, isolated AC/AC transformer, host controller, and
  cables are not included.

  Safety: connect the voltage input only to an isolated 9 VAC transformer
  secondary and use isolated current transformers. This board is not an
  isolation barrier or certified energy meter and must never be connected
  directly to mains voltage.
