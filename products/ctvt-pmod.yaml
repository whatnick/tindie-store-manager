sku: "CTVT-PMOD-V1"
name: "CTVT PMOD - 24-bit Voltage and Current ADC"
description: |
  Assembled open-hardware PMOD analog front end for phase-coherent voltage
  and current sampling. The board uses a Texas Instruments ADS131M02 dual
  24-bit delta-sigma ADC, with both channels sampled simultaneously for
  energy-monitoring, power-measurement, FPGA, ASIC, and DSP experiments.

  The current channel accepts an isolated current-output CT through a 3.5 mm
  stereo jack. Two precision 6.49 ohm burden resistors form a 12.98 ohm
  differential burden; a 100 A:50 mA CT produces approximately 0.649 Vrms at
  rated current. The voltage channel accepts only a certified isolated
  9-12 VAC AC/AC transformer through the barrel jack and uses a balanced
  precision divider.

  A right-angle male PMOD connector plugs into the host while a matching
  vertical female connector passes all 12 pins through for stacking or
  logic-analyzer access. The interface provides SPI, DRDY, RESET, and an
  optional external ADC clock. Seven test points expose the ADC inputs,
  conversion-ready signal, 3.3 V rail, and ground.

  The board is designed to pair with the open-source CTVT Energy DSP Tiny
  Tapeout project, but it can also be controlled by a compatible FPGA or
  microcontroller. Voltage gain, current gain, phase, and channel offset
  should be calibrated against a traceable low-voltage source for accurate
  power and energy measurements.

  What's included:
  - 1x fully assembled CTVT PMOD
  - ADS131M02 ADC, precision analog front end, protection, and connectors

  Current transformer, isolated AC/AC transformer, PMOD host, and cables are
  not included.

  Safety: use only an isolated CT and a certified isolated AC/AC transformer.
  Never connect mains directly to this board. The barrel jack is an isolated
  low-voltage AC measurement input, not a DC power input. This is a
  development board, not a certified energy meter.
