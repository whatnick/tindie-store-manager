sku: "USB-BRB-PCB-V01"
name: "USB Big Red Button Controller PCB"
description: |
  Bare controller PCB for building a USB-connected industrial push-button.
  The design uses a PIC16F1459 microcontroller and provides footprints for
  USB, ESD protection, a status LED, the contact block, and programming
  headers.

  KiCad design files, fabrication outputs, an interactive BOM, and a printable
  PCB carrier are available from the project repository.

  This listing is for the bare PCB only. The push button, contact block, USB
  cable, printed carrier, electronic components, and programmed firmware are
  not included.
