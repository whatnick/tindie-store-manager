sku: "LANTERN-RINGS"
name: "Lantern Rings"
description: |
  Open-hardware lantern ring electronics and optional printed ring parts.

  The Infrared TV-B-Gone populated-PCB option is programmed with the
  open-source Arduino TV-B-Gone firmware and individually function-tested
  before dispatch. Select "Infrared TV-B-Gone" under Populated PCB.

  The IR option is the populated electronics board only unless a printed ring
  body option is also selected. Infrared light is not visible to the eye. A
  CR2032 battery is not included. TV compatibility varies; use the device only
  with equipment you own or have permission to control.
