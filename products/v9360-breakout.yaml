sku: "V9360-BREAKOUT"
name: "V9360 Breakout"
description: |
  Breadboard-compatible breakout for the Vangotech V9360 single-phase energy
  monitoring ASIC. The V9360 communicates over UART (half-duplex, 8O1) and
  supports auto-bauding from 1200 to 19200 bps, making it easy to interface
  with any microcontroller. Onboard 3.3 V LDO so the board can be powered
  from 5 V USB or a regulated 3.3 V supply.

  Open-hardware KiCad design files and an Arduino library with waveform
  capture and on-board FFT examples (ESP32-S3) are available on GitHub.

  ## What's in the box
  - 1x V9360 Breakout PCB (assembled)
  - 2x 1x10 pin headers (unsoldered)

  ## Resources
  - Schematic & PCB: https://github.com/whatnick/V93XX_Breakout
  - Arduino library: https://github.com/whatnick/V93XX_Arduino
