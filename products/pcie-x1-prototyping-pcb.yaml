sku: "PCIE-X1-PROTO-PCB-V1"
name: "PCIe x1 Prototyping PCB"
description: |
  Passive prototyping PCB with a PCIe x1 edge-card form factor and a grid of
  through-hole header positions for experimental wiring and adapter projects.

  The board routes edge-connector contacts into the prototyping area. It does
  not contain a PCIe endpoint controller and is not an active PCIe interface
  or a PCIe-compliant device.

  Eagle board and schematic source files are published under the CERN Open
  Hardware Licence v1.1.

  This listing is for the bare PCB only. Headers and electronic components are
  not included.
