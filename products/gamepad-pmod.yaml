sku: "GAMEPAD-PMOD"
name: "Dual SNES Controller Gamepad PMOD"
description: |
  Hand-assembled Gamepad PMOD for connecting one or two SNES-compatible
  controllers to FPGA, ASIC, RP2040, and other digital projects through a
  standard PMOD header.

  The onboard CH32V003 polls both controllers at up to 600 Hz and reports all
  24 button states as a simple latch, clock, and data stream. Open-source
  Verilog modules and a MicroPython reader are provided for quick integration.

  Choose a board with the standard dual-controller firmware pre-loaded, or an
  unloaded board ready for your own CH32V003 firmware. Firmware can later be
  updated through the PMOD header with a supported programmer.

  Each unit is hand assembled in Adelaide, South Australia. SNES controllers
  and PMOD host hardware are not included.

  The original open-source design and firmware are by Pat Deegan
  (psychogenic). Whatnick contributed the dual-connector mechanical support
  and production-design refinements.
